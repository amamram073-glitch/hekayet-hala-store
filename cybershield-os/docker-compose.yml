services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybershield}
      POSTGRES_USER: ${POSTGRES_USER:-cybershield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybershield} -d ${POSTGRES_DB:-cybershield}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-local_redis_change_me}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-local_redis_change_me}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cybershield}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cybershield}
      REDIS_URL: redis://:${REDIS_PASSWORD:-local_redis_change_me}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE: ${AI_API_BASE:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      REPORT_DIR: ${REPORT_DIR:-/var/lib/cybershield/reports}
      EVIDENCE_STORAGE_PATH: /var/lib/cybershield/evidence
      SCAN_TIMEOUT_SECONDS: ${SCAN_TIMEOUT_SECONDS:-4}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - cyber_evidence:/var/lib/cybershield/evidence
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 15
    restart: unless-stopped
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["celery", "-A", "services.worker.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cybershield}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cybershield}
      REDIS_URL: redis://:${REDIS_PASSWORD:-local_redis_change_me}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      EVIDENCE_STORAGE_PATH: /var/lib/cybershield/evidence
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      SCAN_TIMEOUT_SECONDS: ${SCAN_TIMEOUT_SECONDS:-4}
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - cyber_evidence:/var/lib/cybershield/evidence
    restart: unless-stopped
    networks: [internal]

  dispatcher:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["celery", "-A", "services.worker.celery_app.celery_app", "beat", "--loglevel=INFO"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cybershield}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cybershield}
      REDIS_URL: redis://:${REDIS_PASSWORD:-local_redis_change_me}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
    restart: unless-stopped
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  cyber_evidence:

networks:
  internal:
    driver: bridge
